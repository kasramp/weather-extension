name: Release
on:
  push:
    branches: [master]
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run lint:ext
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            v=$(npm version patch --no-git-tag-version | tr -d v)
            git commit -am "Release v$v"
            git push origin HEAD:master
          fi
          npm run package
          git tag -a "$v" -m "Release v$v" && git push origin "$v"
          gh release create "$v" dist-zip/*.zip --title "Release v$v" --generate-notes
